<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Keittokirja">
<meta name="theme-color" content="#f6f1e9">
<title>Perheen keittokirja</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍲</text></svg>">
<style>
  :root {
    --bg: #f6f1e9;
    --card: #fffdf9;
    --ink: #2b2420;
    --muted: #7a6d63;
    --line: #e6ddd0;
    --accent: #b5502f;
    --accent-ink: #ffffff;
    --chip: #efe5d7;
    --danger: #a3261b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1816;
      --card: #252120;
      --ink: #f1e9df;
      --muted: #a8998c;
      --line: #3a3330;
      --accent: #e07a55;
      --accent-ink: #1b1816;
      --chip: #332d29;
      --danger: #ef6b5e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-size: 1.7rem; margin: 0; font-weight: 600; }
  h1 button { font: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; text-align: left; }
  .item .side { flex: 0 1 auto; display: flex; align-items: center; justify-content: flex-end; gap: 8px; max-width: 50%; min-width: 0; }
  .item .side .menu-badge { flex: 0 1 auto; min-width: 0; max-width: 100%; }
  .item .star { flex: none; font-size: 1.15rem; line-height: 1; }
  h2 { font-family: Georgia, serif; font-size: 1.5rem; margin: 0 0 4px; }
  h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 24px 0 8px; }
  button, .btn {
    font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 9px 14px; border-radius: 10px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.link { border: none; background: none; color: var(--muted); padding: 6px; }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .6; cursor: default; }
  input, textarea, select {
    font: inherit; width: 100%; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  textarea { min-height: 130px; resize: vertical; }
  label { display: block; font-size: .9rem; color: var(--muted); margin: 14px 0 4px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .search { display: flex; gap: 8px; margin-bottom: 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
  .chip {
    background: var(--chip); border: 1px solid transparent; border-radius: 999px;
    padding: 4px 11px; font-size: .85rem; cursor: pointer; color: var(--ink);
  }
  .chip.on { background: var(--accent); color: var(--accent-ink); }
  .list { display: grid; gap: 10px; }
  .item { display: block; text-align: left; width: 100%; padding: 14px 16px; border-radius: 14px; }
  .item .t { font-weight: 600; font-size: 1.05rem; }
  .item .m { color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .meta { color: var(--muted); font-size: .9rem; display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 6px 0; }
  ul.ing { padding-left: 20px; margin: 0; }
  ul.ing li { margin: 4px 0; }
  ol.steps { padding-left: 22px; margin: 0; }
  ol.steps li { margin: 10px 0; }
  .muted { color: var(--muted); }
  .center { text-align: center; }
  .msg { padding: 10px 12px; border-radius: 10px; background: var(--chip); margin: 12px 0; font-size: .92rem; }
  .msg.err { color: var(--danger); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 20px; }
  .hero { width: 100%; max-height: 280px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; }
  .hidden { display: none !important; }
  .notes { white-space: pre-wrap; }
  a { color: var(--accent); word-break: break-word; }
  .home { display: grid; gap: 14px; margin-top: 8px; }
  @media (min-width: 600px) { .home { grid-template-columns: 1fr 1fr; } }
  .cat {
    display: flex; align-items: center; gap: 18px; width: 100%; text-align: left;
    padding: 28px 22px; border-radius: 16px; font-family: Georgia, serif; font-size: 1.35rem; font-weight: 600;
  }
  .cat .e { font-size: 2.4rem; line-height: 1; }
  .cat .s { display: block; margin-top: 4px; font: 400 .9rem/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--muted); }
  .cat:active { transform: scale(.98); }
  select { appearance: none; -webkit-appearance: none; }
  .search button { flex: none; white-space: nowrap; }
  .chips.primary { margin-bottom: 10px; }
  .chips.primary .chip { padding: 7px 14px; font-size: .92rem; border-color: var(--line); background: var(--card); }
  .chips.primary .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip.ghost { background: transparent !important; border: 1px dashed var(--line) !important; color: var(--muted) !important; }
  .chip.ghost.on { border-style: solid !important; color: var(--ink) !important; }
  .item { display: flex; align-items: center; gap: 12px; }
  .item .body { flex: 1; min-width: 0; }
  .menu-badge {
    flex: none; max-width: 45%; font-family: Georgia, serif; font-style: italic; font-size: .82rem; line-height: 1.25;
    color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 3px 8px; text-align: center;
  }
  .dhead { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .dhead .menu-badge { margin-top: 4px; }
  .group-title { font-family: Georgia, serif; font-size: 1.15rem; font-style: italic; margin: 18px 0 8px; color: var(--ink); }
  .urow { padding: 14px 16px; }
  .urow .em { font-weight: 600; word-break: break-all; }
  .urow .st { color: var(--muted); font-size: .88rem; margin-top: 2px; }
  .badge { display: inline-block; font-size: .75rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); margin-left: 6px; vertical-align: middle; }
  .badge.warn { background: var(--accent); color: var(--accent-ink); }
  .urow .actions { margin-top: 10px; }
  .urow .actions button { padding: 7px 12px; font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><button id="titleBtn" type="button" aria-label="Keittokirja – etusivulle">🍲 Keittokirja</button></h1>
    <div style="display:flex;gap:2px;flex-wrap:wrap;justify-content:flex-end">
      <button id="adminBtn" class="link hidden">⚙️ Hallinta</button>
      <button id="logoutBtn" class="link hidden">Kirjaudu ulos</button>
    </div>
  </header>

  <!-- Kirjautuminen -->
  <section id="authView" class="card hidden">
    <h2 id="authTitle">Kirjaudu sisään</h2>
    <p class="muted" id="authHint">Perheen reseptit näkyvät vain kirjautuneille.</p>
    <form id="authForm">
      <label for="email">Sähköposti</label>
      <input id="email" type="email" autocomplete="email" required>
      <label for="password">Salasana</label>
      <input id="password" type="password" autocomplete="current-password" minlength="8" required>
      <div class="actions">
        <button class="primary" type="submit" id="authSubmit">Kirjaudu</button>
        <button class="link" type="button" id="authToggle">Ensimmäinen kerta? Luo tunnus</button>
      </div>
    </form>
    <div id="authMsg" class="msg hidden"></div>
  </section>

  <!-- Etusivu -->
  <section id="homeView" class="hidden">
    <div id="homeMsg" class="msg hidden"></div>
    <div class="home">
      <button class="cat card" data-cat="arkiruoka">
        <span class="e">🥘</span><span>Arkiruoka<span class="s" id="cnt_arkiruoka"></span></span>
      </button>
      <button class="cat card" data-cat="viikonloppuherkut">
        <span class="e">🍷</span><span>Viikonloppuherkut<span class="s" id="cnt_viikonloppuherkut"></span></span>
      </button>
    </div>
    <div class="actions" style="justify-content:space-between;align-items:center">
      <button class="link" data-cat="">Kaikki reseptit →</button>
      <button class="primary" id="newHomeBtn">+ Uusi resepti</button>
    </div>
  </section>

  <!-- Lista -->
  <section id="listView" class="hidden">
    <button class="link" id="homeBtn">← Etusivu</button>
    <h2 id="listTitle" style="margin:6px 0 14px">Kaikki reseptit</h2>
    <div class="search">
      <input id="q" type="search" placeholder="Hae nimellä tai aineksella…" autocomplete="off">
      <button class="primary" id="newBtn">+ Uusi</button>
    </div>
    <div class="chips primary" id="primaryChips"></div>
    <div class="chips hidden" id="tagChips"></div>
    <div id="listMsg" class="msg hidden"></div>
    <div class="list" id="list"></div>
  </section>

  <!-- Resepti -->
  <section id="detailView" class="hidden">
    <button class="link" id="backBtn">← Takaisin</button>
    <article class="card" id="detail"></article>
  </section>

  <!-- Lomake -->
  <section id="editView" class="hidden">
    <button class="link" id="cancelBtn">← Peruuta</button>
    <form id="editForm" class="card">
      <h2 id="editTitle">Uusi resepti</h2>
      <label for="f_title">Nimi *</label>
      <input id="f_title" required maxlength="200">
      <label for="f_category">Kategoria</label>
      <select id="f_category">
        <option value="arkiruoka">🥘 Arkiruoka</option>
        <option value="viikonloppuherkut">🍷 Viikonloppuherkut</option>
        <option value="">Ei kategoriaa</option>
      </select>
      <label for="f_menu">Menu (valinnainen)</label>
      <input id="f_menu" list="menuList" autocomplete="off" placeholder="esim. Lapponia alla piemontese">
      <datalist id="menuList"></datalist>
      <label style="display:flex;align-items:center;gap:8px;color:var(--ink)">
        <input type="checkbox" id="f_top" style="width:auto;margin:0"> ⭐ Top-listalla
      </label>
      <label for="f_description">Lyhyt kuvaus</label>
      <input id="f_description">
      <div class="row">
        <div><label for="f_servings">Annoksia</label><input id="f_servings" type="number" min="1" inputmode="numeric"></div>
        <div><label for="f_prep">Aika (min)</label><input id="f_prep" type="number" min="0" inputmode="numeric"></div>
      </div>
      <label for="f_ingredients">Ainekset (yksi per rivi)</label>
      <textarea id="f_ingredients" placeholder="2 dl kermaa&#10;1 sipuli"></textarea>
      <label for="f_instructions">Ohje (yksi vaihe per rivi)</label>
      <textarea id="f_instructions" placeholder="Kuullota sipuli voissa.&#10;Lisää kerma ja keitä hiljalleen."></textarea>
      <label for="f_tags">Tagit (pilkulla erotettuna)</label>
      <input id="f_tags" placeholder="arkiruoka, kasvis">
      <label for="f_source">Lähde (linkki tai kuka antoi)</label>
      <input id="f_source">
      <label for="f_image">Kuvan osoite</label>
      <input id="f_image" type="url" placeholder="https://…">
      <label for="f_notes">Muistiinpanot</label>
      <textarea id="f_notes" style="min-height:80px"></textarea>
      <div class="actions">
        <button class="primary" type="submit" id="saveBtn">Tallenna</button>
      </div>
      <div id="editMsg" class="msg err hidden"></div>
    </form>
  </section>

  <!-- Käyttäjien hallinta -->
  <section id="adminView" class="hidden">
    <button class="link" id="adminBackBtn">← Etusivu</button>
    <h2 style="margin:6px 0 4px">Käyttäjien hallinta</h2>
    <p class="muted" style="margin:0 0 14px">Vain listalla olevat näkevät reseptit. Uusi jäsen luo itse tunnuksen keittokirjan kirjautumissivulla samalla sähköpostilla.</p>
    <form id="addUserForm" class="card">
      <label for="u_email" style="margin-top:0">Lisää perheenjäsen</label>
      <input id="u_email" type="email" autocomplete="off" placeholder="nimi@esimerkki.fi" required>
      <label style="display:flex;align-items:center;gap:8px;color:var(--ink)">
        <input type="checkbox" id="u_admin" style="width:auto;margin:0"> Admin-oikeudet (voi hallita käyttäjiä)
      </label>
      <div class="actions" style="margin-top:12px"><button class="primary" type="submit" id="addUserBtn">Lisää</button></div>
    </form>
    <div id="adminMsg" class="msg hidden"></div>
    <h3>Käyttäjät</h3>
    <div class="list" id="userList"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
  // Julkiset asetukset. Tämä avain on tarkoitettu selaimeen;
  // tietokannan suojaus (RLS) estää pääsyn ilman perheen tunnusta.
  const SUPABASE_URL = "https://uzeaweqwthoofbmodutf.supabase.co";
  const SUPABASE_KEY = "sb_publishable_B9rpC9YrWJjWS1CeNF9nBg_V0utR7sg";

  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const $ = (id) => document.getElementById(id);

  const CATS = { arkiruoka: "Arkiruoka", viikonloppuherkut: "Viikonloppuherkut" };
  // Päärajaukset kategorioittain: [tagi, otsikko]. "@menu" = reseptit, joilla on menu.
  const PRIMARY = {
    arkiruoka: [["top", "⭐ Top-lista"], ["kana", "Kana"], ["nauta", "Nauta"], ["kasvis", "Kasvis"]],
    viikonloppuherkut: [["top", "⭐ Top-lista"], ["@menu", "Menut"], ["alkuruoka", "Alkuruoka"], ["illallinen", "Illallinen"], ["makeat", "Makeat"], ["pasta", "Pasta"]],
  };
  const COURSE_ORDER = ["alkuruoka", "illallinen", "makeat"];
  const isMeta = (t) => !!CATS[t] || t === "top" || t.startsWith("menu:");
  const menuOf = (r) => { const t = (r.tags || []).find((x) => x.startsWith("menu:")); return t ? t.slice(5) : null; };
  const plainTags = (r) => (r.tags || []).filter((t) => !isMeta(t));
  let activePrimary = null;
  let showTags = false;
  let recipes = [];
  let currentCat = null;
  let returnView = "listView";
  let isAdmin = false;
  let myEmail = "";
  let activeTag = null;
  let editingId = null;
  let signupMode = false;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeUrl = (u) => { try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : null; } catch { return null; } };
  const lines = (s) => s.split("\n").map((l) => l.trim()).filter(Boolean);
  const asText = (v) => (typeof v === "string" ? v : v && (v.text || [v.amount, v.unit, v.name].filter(Boolean).join(" ")));

  function show(view) {
    for (const v of ["authView", "homeView", "listView", "detailView", "editView", "adminView"]) $(v).classList.toggle("hidden", v !== view);
    $("logoutBtn").classList.toggle("hidden", view === "authView");
    $("adminBtn").classList.toggle("hidden", view === "authView" || view === "adminView" || !isAdmin);
    window.scrollTo(0, 0);
  }
  function msg(el, text, isErr) {
    el.textContent = text || "";
    el.classList.toggle("hidden", !text);
    el.classList.toggle("err", !!isErr);
  }

  // ---------- Kirjautuminen ----------
  $("authToggle").onclick = () => {
    signupMode = !signupMode;
    $("authTitle").textContent = signupMode ? "Luo tunnus" : "Kirjaudu sisään";
    $("authSubmit").textContent = signupMode ? "Luo tunnus" : "Kirjaudu";
    $("authToggle").textContent = signupMode ? "Onko sinulla jo tunnus? Kirjaudu" : "Ensimmäinen kerta? Luo tunnus";
    $("password").autocomplete = signupMode ? "new-password" : "current-password";
    msg($("authMsg"), "");
  };

  $("authForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("email").value.trim().toLowerCase();
    const password = $("password").value;
    $("authSubmit").disabled = true;
    msg($("authMsg"), "");
    try {
      if (signupMode) {
        const { data, error } = await sb.auth.signUp({
          email, password, options: { emailRedirectTo: location.origin + location.pathname },
        });
        if (error) throw error;
        if (!data.session) msg($("authMsg"), "Tunnus luotu. Vahvista sähköpostiisi tullut linkki ja kirjaudu sitten sisään.");
      } else {
        const { error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
      }
    } catch (err) {
      const m = err.message || "";
      msg($("authMsg"),
        /invalid login/i.test(m) ? "Väärä sähköposti tai salasana." :
        /not confirmed/i.test(m) ? "Vahvista ensin sähköpostiisi tullut linkki." :
        /already registered/i.test(m) ? "Tunnus on jo olemassa. Kirjaudu sisään." :
        "Virhe: " + m, true);
    } finally {
      $("authSubmit").disabled = false;
    }
  };

  $("logoutBtn").onclick = () => sb.auth.signOut();

  sb.auth.onAuthStateChange((_evt, session) => {
    // setTimeout: Supabase-kutsuja ei pidä tehdä suoraan tämän callbackin sisällä
    if (session) {
      myEmail = (session.user?.email || "").toLowerCase();
      if (!recipes.length) setTimeout(() => { loadRecipes(); checkAdmin(); }, 0);
    } else { recipes = []; isAdmin = false; myEmail = ""; show("authView"); }
  });

  // ---------- Käyttäjien hallinta ----------
  async function checkAdmin() {
    const { data } = await sb.rpc("am_i_admin");
    isAdmin = data === true;
    const visible = !$("homeView").classList.contains("hidden") || !$("listView").classList.contains("hidden")
      || !$("detailView").classList.contains("hidden") || !$("editView").classList.contains("hidden");
    $("adminBtn").classList.toggle("hidden", !(isAdmin && visible));
  }

  async function loadUsers() {
    show("adminView");
    $("userList").innerHTML = `<p class="muted">Ladataan…</p>`;
    const { data, error } = await sb.rpc("admin_list_users");
    if (error) { $("userList").innerHTML = ""; return msg($("adminMsg"), "Käyttäjien lataus epäonnistui: " + error.message, true); }
    const fmt = (d) => d ? new Date(d).toLocaleString("fi-FI", { day: "numeric", month: "numeric", year: "numeric", hour: "2-digit", minute: "2-digit" }) : "";
    $("userList").innerHTML = data.map((u) => {
      const me = u.email === myEmail;
      const status = !u.on_list ? "Luonut tunnuksen, mutta ei ole perheen listalla"
        : !u.registered ? "Ei ole vielä luonut tunnusta"
        : !u.confirmed ? "Odottaa sähköpostivahvistusta"
        : u.last_sign_in ? "Viimeksi kirjautunut " + fmt(u.last_sign_in) : "Tunnus luotu";
      const e = esc(u.email);
      const buttons = !u.on_list
        ? `<button class="primary" data-act="grant" data-email="${e}">Anna pääsy</button>`
        : me ? `<span class="muted" style="font-size:.88rem">Tämä olet sinä</span>`
        : `<button data-act="${u.is_admin ? "unadmin" : "admin"}" data-email="${e}">${u.is_admin ? "Poista admin" : "Tee adminiksi"}</button>
           <button class="danger" data-act="remove" data-email="${e}">Poista pääsy</button>`;
      return `<div class="card urow">
        <div class="em">${e}${u.is_admin ? `<span class="badge">admin</span>` : ""}${!u.on_list ? `<span class="badge warn">ei pääsyä</span>` : ""}</div>
        <div class="st">${esc(status)}</div>
        <div class="actions">${buttons}</div>
      </div>`;
    }).join("") || `<p class="muted">Ei käyttäjiä.</p>`;
  }

  async function adminCall(fn, args, okText) {
    msg($("adminMsg"), "");
    const { error } = await sb.rpc(fn, args);
    if (error) return msg($("adminMsg"), "Virhe: " + error.message, true);
    msg($("adminMsg"), okText);
    loadUsers();
  }

  $("adminBtn").onclick = () => { msg($("adminMsg"), ""); loadUsers(); };
  $("adminBackBtn").onclick = () => { renderHome(); show("homeView"); };

  $("addUserForm").onsubmit = async (e) => {
    e.preventDefault();
    const email = $("u_email").value.trim().toLowerCase();
    $("addUserBtn").disabled = true;
    await adminCall("admin_add_member", { p_email: email, p_admin: $("u_admin").checked },
      `${email} lisätty. Hän voi nyt luoda tunnuksen keittokirjan kirjautumissivulla.`);
    $("addUserBtn").disabled = false;
    if (!$("adminMsg").classList.contains("err")) { $("u_email").value = ""; $("u_admin").checked = false; }
  };

  $("userList").onclick = (e) => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const email = b.dataset.email;
    if (b.dataset.act === "grant") adminCall("admin_add_member", { p_email: email, p_admin: false }, `${email} sai pääsyn.`);
    if (b.dataset.act === "admin") adminCall("admin_set_admin", { p_email: email, p_admin: true }, `${email} on nyt admin.`);
    if (b.dataset.act === "unadmin") adminCall("admin_set_admin", { p_email: email, p_admin: false }, `${email} ei ole enää admin.`);
    if (b.dataset.act === "remove" && confirm(`Poistetaanko käyttäjän ${email} pääsy keittokirjaan?`))
      adminCall("admin_remove_member", { p_email: email }, `${email} poistettu listalta.`);
  };

  // ---------- Lista ----------
  async function loadRecipes(view) {
    view = view === "listView" ? "listView" : "homeView";
    show(view);
    msg($("homeMsg"), "Ladataan…");
    const { data, error } = await sb.from("recipes").select("*").order("title");
    if (error) { show("homeView"); msg($("homeMsg"), "Reseptien lataus epäonnistui: " + error.message, true); return; }
    recipes = data;
    msg($("homeMsg"), recipes.length ? "" :
      "Ei reseptejä vielä. Jos tunnuksesi on uusi, pyydä että sähköpostisi lisätään perheen listalle.");
    renderHome();
    if (view === "listView") renderList();
  }

  // ---------- Etusivu ----------
  function renderHome() {
    for (const c of Object.keys(CATS)) {
      const n = recipes.filter((r) => (r.tags || []).includes(c)).length;
      $("cnt_" + c).textContent = n + (n === 1 ? " resepti" : " reseptiä");
    }
  }
  function openCategory(cat) {
    currentCat = cat || null;
    activeTag = null;
    activePrimary = null;
    showTags = false;
    $("q").value = "";
    $("listTitle").textContent = currentCat ? CATS[currentCat] : "Kaikki reseptit";
    show("listView");
    renderList();
  }
  $("homeView").onclick = (e) => {
    const b = e.target.closest("[data-cat]");
    if (b) openCategory(b.dataset.cat);
  };
  $("newHomeBtn").onclick = () => { currentCat = null; returnView = "homeView"; openEditor(null); };
  $("homeBtn").onclick = () => { renderHome(); show("homeView"); };
  $("titleBtn").onclick = () => {
    if (!$("authView").classList.contains("hidden")) return; // ei kirjautunut
    renderHome(); show("homeView");
  };

  // ---------- Lista ----------
  function renderList() {
    const q = $("q").value.trim().toLowerCase();
    const base = currentCat ? recipes.filter((r) => (r.tags || []).includes(currentCat)) : recipes;

    // Päärajaukset + Tagit-nappi
    const prim = PRIMARY[currentCat] || [];
    $("primaryChips").innerHTML =
      (prim.length ? [["", "Kaikki"], ...prim] : []).map(([k, label]) =>
        `<button class="chip ${(activePrimary || "") === k ? "on" : ""}" data-prim="${esc(k)}">${esc(label)}</button>`).join("") +
      `<button class="chip ghost ${showTags ? "on" : ""}" data-tagtoggle="1" aria-expanded="${showTags}">🏷 Tagit${activeTag ? " · " + esc(activeTag) : ""} ${showTags ? "▴" : "▾"}</button>`;

    // Pikatagit (piilossa oletuksena)
    const tags = [...new Set(base.flatMap(plainTags))].sort((a, b) => a.localeCompare(b, "fi"));
    $("tagChips").classList.toggle("hidden", !showTags);
    $("tagChips").innerHTML = tags.map((t) =>
      `<button class="chip ${t === activeTag ? "on" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("");

    msg($("listMsg"), base.length ? "" : "Tässä kategoriassa ei ole vielä reseptejä.");
    const shown = base.filter((r) => {
      const tg = r.tags || [];
      if (activePrimary === "@menu" && !menuOf(r)) return false;
      if (activePrimary && activePrimary !== "@menu" && !tg.includes(activePrimary)) return false;
      if (activeTag && !tg.includes(activeTag)) return false;
      if (!q) return true;
      const hay = [r.title, r.description, menuOf(r), ...(r.ingredients || []).map(asText), ...plainTags(r)].join(" ").toLowerCase();
      return hay.includes(q);
    });

    const item = (r, grouped) => {
      const menu = grouped ? null : menuOf(r);
      const top = (r.tags || []).includes("top");
      const meta = [r.prep_minutes ? r.prep_minutes + " min" : "", plainTags(r).join(", ")]
        .filter(Boolean).map(esc).join(" · ");
      return `<button class="item card" data-id="${r.id}">
        <div class="body"><div class="t">${esc(r.title)}</div><div class="m">${meta}</div></div>
        ${menu || top ? `<div class="side">
          ${menu ? `<span class="menu-badge">${esc(menu)}</span>` : ""}
          ${top ? `<span class="star" role="img" aria-label="Top-listalla">⭐</span>` : ""}
        </div>` : ""}
      </button>`;
    };
    const empty = base.length ? `<p class="muted center">Ei osumia.</p>` : "";

    if (activePrimary === "@menu") {
      const groups = new Map();
      for (const r of shown) { const m = menuOf(r); if (!groups.has(m)) groups.set(m, []); groups.get(m).push(r); }
      const rank = (r) => { const i = COURSE_ORDER.findIndex((c) => (r.tags || []).includes(c)); return i < 0 ? 99 : i; };
      $("list").innerHTML = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], "fi")).map(([m, rs]) =>
        `<div class="group-title">🍽 ${esc(m)}</div><div class="list">${rs.sort((a, b) => rank(a) - rank(b)).map((r) => item(r, true)).join("")}</div>`
      ).join("") || empty;
    } else {
      $("list").innerHTML = shown.map((r) => item(r)).join("") || empty;
    }
  }

  $("primaryChips").onclick = (e) => {
    if (e.target.closest("[data-tagtoggle]")) { showTags = !showTags; return renderList(); }
    const b = e.target.closest("[data-prim]"); if (!b) return;
    activePrimary = b.dataset.prim || null;
    renderList();
  };
  $("q").oninput = renderList;
  $("tagChips").onclick = (e) => {
    const t = e.target.closest("[data-tag]"); if (!t) return;
    activeTag = activeTag === t.dataset.tag ? null : t.dataset.tag; renderList();
  };
  $("list").onclick = (e) => { const b = e.target.closest("[data-id]"); if (b) openRecipe(b.dataset.id); };
  $("newBtn").onclick = () => { returnView = "listView"; openEditor(null); };

  // ---------- Resepti ----------
  function openRecipe(id) {
    const r = recipes.find((x) => x.id === id); if (!r) return;
    const img = safeUrl(r.image_url);
    const src = r.source ? (safeUrl(r.source) ? `<a href="${esc(r.source)}" target="_blank" rel="noopener">${esc(r.source)}</a>` : esc(r.source)) : "";
    const menu = menuOf(r);
    const isTop = (r.tags || []).includes("top");
    $("detail").innerHTML = `
      ${img ? `<img class="hero" src="${esc(img)}" alt="">` : ""}
      <div class="dhead">
        <h2>${esc(r.title)}</h2>
        ${menu ? `<span class="menu-badge">${esc(menu)}</span>` : ""}
      </div>
      ${r.description ? `<p class="muted" style="margin:4px 0">${esc(r.description)}</p>` : ""}
      <div class="meta">
        ${r.servings ? `<span>🍽 ${r.servings} annosta</span>` : ""}
        ${r.prep_minutes ? `<span>⏱ ${r.prep_minutes} min</span>` : ""}
        ${plainTags(r).length ? `<span>🏷 ${esc(plainTags(r).join(", "))}</span>` : ""}
      </div>
      ${(r.ingredients || []).length ? `<h3>Ainekset</h3><ul class="ing">${r.ingredients.map((i) => `<li>${esc(asText(i))}</li>`).join("")}</ul>` : ""}
      ${(r.instructions || []).length ? `<h3>Ohje</h3><ol class="steps">${r.instructions.map((s) => `<li>${esc(asText(s))}</li>`).join("")}</ol>` : ""}
      ${r.notes ? `<h3>Muistiinpanot</h3><p class="notes">${esc(r.notes)}</p>` : ""}
      ${src ? `<h3>Lähde</h3><p>${src}</p>` : ""}
      <div class="actions">
        <button id="topBtn">${isTop ? "★ Poista Top-listalta" : "⭐ Lisää Top-listalle"}</button>
        <button id="editBtn">Muokkaa</button>
        <button id="delBtn" class="danger">Poista</button>
      </div>`;
    $("topBtn").onclick = async () => {
      const tags = isTop ? (r.tags || []).filter((t) => t !== "top") : [...(r.tags || []), "top"];
      $("topBtn").disabled = true;
      const { data, error } = await sb.from("recipes").update({ tags }).eq("id", r.id).select().single();
      if (error) { $("topBtn").disabled = false; return alert("Tallennus epäonnistui: " + error.message); }
      recipes[recipes.findIndex((x) => x.id === r.id)] = data;
      openRecipe(r.id);
    };
    $("editBtn").onclick = () => openEditor(r);
    $("delBtn").onclick = async () => {
      if (!confirm(`Poistetaanko "${r.title}"?`)) return;
      const { error } = await sb.from("recipes").delete().eq("id", r.id);
      if (error) return alert("Poisto epäonnistui: " + error.message);
      loadRecipes("listView");
    };
    show("detailView");
  }
  $("backBtn").onclick = () => { show("listView"); renderList(); };

  // ---------- Lomake ----------
  function openEditor(r) {
    editingId = r ? r.id : null;
    $("editTitle").textContent = r ? "Muokkaa reseptiä" : "Uusi resepti";
    $("f_title").value = r?.title || "";
    $("f_description").value = r?.description || "";
    $("f_servings").value = r?.servings || "";
    $("f_prep").value = r?.prep_minutes || "";
    $("f_ingredients").value = (r?.ingredients || []).map(asText).join("\n");
    $("f_instructions").value = (r?.instructions || []).map(asText).join("\n");
    $("f_category").value = r
      ? (Object.keys(CATS).find((c) => (r.tags || []).includes(c)) || "")
      : (currentCat || "arkiruoka");
    $("f_tags").value = r ? plainTags(r).join(", ") : "";
    $("f_menu").value = r ? (menuOf(r) || "") : "";
    $("f_top").checked = !!r && (r.tags || []).includes("top");
    $("menuList").innerHTML = [...new Set(recipes.map(menuOf).filter(Boolean))]
      .map((m) => `<option value="${esc(m)}"></option>`).join("");
    $("f_source").value = r?.source || "";
    $("f_image").value = r?.image_url || "";
    $("f_notes").value = r?.notes || "";
    msg($("editMsg"), "");
    show("editView");
  }
  $("cancelBtn").onclick = () => {
    if (editingId) return openRecipe(editingId);
    if (returnView === "homeView") { renderHome(); show("homeView"); } else { show("listView"); renderList(); }
  };

  $("editForm").onsubmit = async (e) => {
    e.preventDefault();
    const num = (v) => (v === "" ? null : parseInt(v, 10));
    const row = {
      title: $("f_title").value.trim(),
      description: $("f_description").value.trim() || null,
      servings: num($("f_servings").value),
      prep_minutes: num($("f_prep").value),
      ingredients: lines($("f_ingredients").value),
      instructions: lines($("f_instructions").value),
      tags: [...new Set([
        ...($("f_category").value ? [$("f_category").value] : []),
        ...($("f_top").checked ? ["top"] : []),
        ...($("f_menu").value.trim() ? ["menu:" + $("f_menu").value.trim().replace(/\s+/g, " ")] : []),
        ...$("f_tags").value.split(",").map((t) => t.trim().toLowerCase()).filter((t) => t && !isMeta(t)),
      ])],
      source: $("f_source").value.trim() || null,
      image_url: $("f_image").value.trim() || null,
      notes: $("f_notes").value.trim() || null,
    };
    $("saveBtn").disabled = true;
    const q = editingId
      ? sb.from("recipes").update(row).eq("id", editingId).select().single()
      : sb.from("recipes").insert(row).select().single();
    const { data, error } = await q;
    $("saveBtn").disabled = false;
    if (error) return msg($("editMsg"), "Tallennus epäonnistui: " + error.message, true);
    const i = recipes.findIndex((x) => x.id === data.id);
    if (i >= 0) recipes[i] = data; else recipes.push(data);
    recipes.sort((a, b) => a.title.localeCompare(b.title, "fi"));
    openRecipe(data.id);
  };

  // ---------- Käynnistys ----------
  sb.auth.getSession().then(({ data }) => { if (!data.session) show("authView"); });
</script>
</body>
</html>
